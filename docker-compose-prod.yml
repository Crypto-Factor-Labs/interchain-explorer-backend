volumes:
  pgdata:

networks:
  default:
    external: true
    name: opendapps-cloud

services:
  explorer-backend-service:
    restart: always
    build:
      context: .
      dockerfile: ./docker/prod.Dockerfile
    env_file:
      - .env.default
    labels:
      - traefik.http.routers.explorer-api.rule=PathPrefix(`/api/`)
    volumes:
      - .:/usr/src/app

  explorer-backend-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: explorer
    volumes:
      - pgdata:/var/lib/postgresql/data